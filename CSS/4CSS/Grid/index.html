<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actual use of grid</title>
    <style>
         .items{
            border: 1px solid black;
            height: 100px;
            width: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
         }
         .container{
            display: grid;
            grid-template-areas: 
            "nav nav2"
            "side main";
         }
         .item1{
            background-color: aqua;
            grid-area: nav;
         }
         .item2{
            background-color: aqua;
            grid-area:nav2;
         }
         .item3{
            background-color:rebeccapurple;
             grid-area:side;
         }
         .item4{
            background-color: orange;
            grid-area: main;
         }
         .item5{
            background-color: yellowgreen;
            grid-area: footer;
         }
    </style>
</head>
<body>
    <div class="container">
        <div class="items item1">Box 1</div>
        <div class="items item2">Box 2</div>
        <div class="items item3">Box 3</div>
        <div class="items item4">Box 4</div>
        <div class="items item5" id="item5">Box 5</div>
    </div>
</body>
</html>
