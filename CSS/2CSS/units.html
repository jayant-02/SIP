<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        /* Style in ul*/
        .meri{
            font-size: 1pc;
        }
         .teri{
           
        }


        #a {
            list-style-type: circle;
           font-size: 210%;
        }
        #b {
            list-style-type: disc;
             font-size: 1.3em;
            
        }
        #c{
            list-style-type: square;
             font-size: 2.3rem;
        }
        #d{
            list-style-type: georgian;
             font-size: 2.3rem;
        }

        /* Style in ol*/
        #e{
            list-style-type: georgian;
        }
        #f{
            list-style-type: upper-roman;
        }
        #g{
            list-style-type: lower-latin;
        }
        #h{
            list-style-type: lower-greek;
        }
    </style>
</head>
<body>
    <h1>unordered list</h1>

    <ul class="meri">
        <li id="a">jayant</li>
        <li id="b">jayant2</li>
        <li id="c">jayant3</li>
        <li id="d">jaymesh khan</li>
    </ul>
<h1>ordered list</h1>
<ol class="teri">
    <li id="e">abc</li>
    <li id="f">def</li>
    <li id="g">ghi</li>
    <li id="h">jkl</li>
</ol>
</body>
</html>
