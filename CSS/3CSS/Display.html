<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DISPLAY_CSS</title>
    <style>
        button{
            display: block;
            margin-bottom: 10px;
        }
        div{
            border: 1px solid black;
            margin: 5px;
            display: inline;
            padding: 3px;
        }
        li{
            display: inline-block;
            width: 20px;
        }
        p{
            display: none;
        }
    </style>
</head>
<body>
    <h1>Learning display properties of css!</h1>
    <!-- applying block element to inline element -->
    <button>button1</button>
    <button>button2</button>
    <button>button3</button><br>

    <!-- block element to inline element-inline element does not have valid height and width property -->
    <div>
        Div1
    </div>
    <div>
        Div1
    </div>
    <div>
        Div1
    </div>

    <!-- block to inline-block-inline block has valid height and width property. -->
    <ul>
        <li>1</li>
        <li>2</li>
        <li>3</li>
    </ul>

    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Asperiores minima voluptate pariatur quam error nobis quod provident ea adipisci qui voluptatem, sit molestias totam reprehenderit, quaerat quia culpa saepe aliquam?em50</p>
</body>
</html>
