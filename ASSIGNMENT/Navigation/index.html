<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Navbar</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        nav{
            background-color: #333;
            padding: 15px 30px;
        }

        ul{
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        a{
            text-decoration: none;
            color: white;
            font-size: 18px;
        }

        a:hover{
            color: yellow;
             border-bottom: 2px solid yellow;
        }
    </style>
</head>
<body>

    <nav>
        <ul>
            <li><a href="\CSS\3CSS\Navigation\index.html">Home</a></li>
            <li><a href="\CSS\3CSS\Navigation\about.html">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="\CSS\3CSS\Navigation\contact.html">Contact</a></li>
        </ul>
    </nav>

</body>
</html>
